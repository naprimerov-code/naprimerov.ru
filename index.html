    <!-- ================= БЛОК С КАРТИНОЙ (В САМОМ ВЕРХУ) ================= -->
    <style>
        .hero-portrait-container {
            width: 100%;
            max-width: 900px;
            margin: 20px auto 40px auto;
            padding: 0 15px;
            box-sizing: border-box;
        }
        .hero-frame-container {
            position: relative;
            width: 100%;
            background: #0b0b0e;
            padding: 16px;
            border: 12px solid transparent;
            border-image: linear-gradient(to bottom right, #f3e5ab, #aa8c2c, #5c4b12) 1;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(212, 175, 55, 0.1);
            box-sizing: border-box;
            text-align: center;
        }
        .hero-image-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
            cursor: zoom-in;
            aspect-ratio: 16 / 9;
        }
        .hero-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }
        .hero-image-wrapper.zoomed img {
            transform: scale(1.6);
            cursor: zoom-out;
        }
        .hero-plaque {
            margin-top: 15px;
            background: linear-gradient(135deg, #2b2512, #1a160a);
            border: 1px solid #d4af37;
            text-align: center;
            padding: 8px 20px;
            box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.2);
            display: inline-block;
        }
        .hero-plaque span {
            font-family: 'Times New Roman', serif;
            font-size: 1.5rem;
            letter-spacing: 4px;
            color: #f3e5ab;
            text-transform: uppercase;
            font-weight: bold;
        }
    </style>

    <div class="hero-portrait-container">
        <div class="hero-frame-container">
            <div class="hero-image-wrapper" id="heroImageWrapper" onclick="this.classList.toggle('zoomed')" title="Нажмите для увеличения">
                <img src="69697.jpg" alt="Портрет рода Напримеровых">
            </div>
            <div class="hero-plaque">
                <span>НАПРИМЕРОВ</span>
            </div>
        </div>
    </div>
    <!-- ================= КОНЕЦ БЛОКА С КАРТИНОЙ ================= -->
